<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Renshu v14</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#fff8fb;color:#332b38;display:grid;place-items:center;min-height:100dvh;margin:0;padding:24px;text-align:center}.box{background:#fff;border:1.5px solid #ffd1e1;border-radius:24px;padding:24px;max-width:430px;box-shadow:0 10px 28px rgba(160,86,128,.15)}.err{color:#9b263a;font-weight:800}</style></head><body><div class="box"><h1>🐰🌸 Fast Renshu</h1><div id="msg">Đang mở v14 · xếp theo Excel...</div></div><script>(async()=>{const core='https://raw.githubusercontent.com/ngocbabby/n3-jlpt-app/6ec26481ac997d3a53c5bc1582e13695dc8f3efc/fast-renshu.html';const files=['fast-renshu-ov01.json','fast-renshu-ov02a.json','fast-renshu-ov02b.json','fast-renshu-ov03.json','fast-renshu-ov04a.json','fast-renshu-ov04b.json','fast-renshu-ov05.json','fast-renshu-ov06.json','fast-renshu-ov07.json'];const base={"\u52d5\u4f5c":"\u3069\u3046\u3055","\u51fa\u5f35":"\u3057\u3085\u3063\u3061\u3087\u3046","\u7de0\u5207":"\u3057\u3081\u304d\u308a","\u7de0\u3081\u5207\u308a":"\u3057\u3081\u304d\u308a","\u52e7\u3081\u3066":"\u3059\u3059\u3081\u3066","\u52e7\u3081\u308b":"\u3059\u3059\u3081\u308b","\u7d66\u6599":"\u304d\u3085\u3046\u308a\u3087\u3046","\u6210\u529f":"\u305b\u3044\u3053\u3046","\u5efa\u8a2d":"\u3051\u3093\u305b\u3064","\u65e9\u9000":"\u305d\u3046\u305f\u3044"};try{const arr=await Promise.all([fetch(core,{cache:'no-store'}).then(r=>r.text()),...files.map(f=>fetch(f+'?v=14',{cache:'reload'}).then(r=>r.ok?r.json():{}).catch(()=>({})))]);let html=arr[0];const manual=Object.assign({},base,...arr.slice(1));html=html.replace(/const MANUAL=\{[^;]*\};/,'const MANUAL='+JSON.stringify(manual)+';');html=html.replace("STORE='fast-renshu-v11'","STORE='fast-renshu-v14-excel-order'");html=html.replace('Bản sạch · sửa reading/nghĩa','v14 · theo thứ tự Excel');const patch="function linearPath(g){const seq=[...g.vocab,...g.kanji,...g.grammar,...g.exam];seq.forEach((x,i)=>{x.stage=Math.floor(i/BATCH);x.reading=bestRead(x.term,x.reading)});const n=Math.ceil(seq.length/BATCH);STAGE_INFO=Array.from({length:n},(_,i)=>{const s=seq.slice(i*BATCH,(i+1)*BATCH);const kinds=[...new Set(s.map(x=>x.kind))];let label=kinds.length===1?kinds[0]+' · theo thứ tự Excel':kinds.join(' → ')+' · chuyển mục';return{theme:label,count:s.length,from:i*BATCH+1,to:i*BATCH+s.length}});return seq}\nfunction auditItems(){return {missingReading:ITEMS.filter(x=>/[一-龯々〆〤]/.test(x.term)&&x.kind!=='Ngữ pháp'&&!/[ぁ-んァ-ン]/.test(displayReading(x))).length,termErrors:ITEMS.filter(x=>!/[一-龯ぁ-んァ-ン々〆〤]/.test(x.term)).length,meaningErrors:ITEMS.filter(x=>/^([一-龯ぁ-んァ-ンー]+(?:する)?)[=＝]/.test(x.meaning)).length}}\nfunction examItem(q,m,label,id)";html=html.replace('function examItem(q,m,label,id)',patch);html=html.replace('ITEMS=buildPath(g);','ITEMS=linearPath(g);');html=html.replace("document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Đã sửa reading/nghĩa và tránh trùng sát nhau.`;renderAll()","const A=auditItems();document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Thứ tự Excel: Từ vựng → Kanji → Ngữ pháp → Từ đề thi. Override ${Object.keys(MANUAL).length} mục. Thiếu cách đọc ${A.missingReading}.`;renderAll()");document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').innerHTML='<span class="err">Không mở được v14.</span>';console.error(e)}})();</script></body></html>
