<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Renshu v13</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#fff8fb;color:#332b38;display:grid;place-items:center;min-height:100dvh;margin:0;padding:24px;text-align:center}.box{background:#fff;border:1.5px solid #ffd1e1;border-radius:24px;padding:24px;max-width:430px;box-shadow:0 10px 28px rgba(160,86,128,.15)}.err{color:#9b263a;font-weight:800}</style></head><body><div class="box"><h1>🐰🌸 Fast Renshu</h1><div id="msg">Đang mở v13...</div></div><script>(async()=>{const core='https://raw.githubusercontent.com/ngocbabby/n3-jlpt-app/6ec26481ac997d3a53c5bc1582e13695dc8f3efc/fast-renshu.html';const files=['fast-renshu-ov01.json','fast-renshu-ov02a.json','fast-renshu-ov02b.json','fast-renshu-ov03.json','fast-renshu-ov04a.json','fast-renshu-ov04b.json','fast-renshu-ov05.json','fast-renshu-ov06.json','fast-renshu-ov07.json'];try{const arr=await Promise.all([fetch(core,{cache:'no-store'}).then(r=>r.text()),...files.map(f=>fetch(f+'?v=13',{cache:'reload'}).then(r=>r.ok?r.json():{}).catch(()=>({})))]);let html=arr[0];const manual=Object.assign({},...arr.slice(1));html=html.replace(/const MANUAL=\{[^;]*\};/,'const MANUAL='+JSON.stringify(manual)+';');html=html.replace("STORE='fast-renshu-v11'","STORE='fast-renshu-v13'");html=html.replace('Bản sạch · sửa reading/nghĩa','v13 · override '+Object.keys(manual).length+' mục');html=html.replace('function examItem(q,m,label,id)',"function auditItems(){return {missingReading:ITEMS.filter(x=>/[一-龯々〆〤]/.test(x.term)&&x.kind!=='Ngữ pháp'&&!/[ぁ-んァ-ン]/.test(displayReading(x))).length,termErrors:ITEMS.filter(x=>!/[一-龯ぁ-んァ-ン々〆〤]/.test(x.term)).length,meaningErrors:ITEMS.filter(x=>/^([一-龯ぁ-んァ-ンー]+(?:する)?)[=＝]/.test(x.meaning)).length}}\nfunction examItem(q,m,label,id)");html=html.replace("document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Đã sửa reading/nghĩa và tránh trùng sát nhau.`;renderAll()","const A=auditItems();document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Override ${Object.keys(MANUAL).length} mục. Audit: thiếu cách đọc ${A.missingReading} · term lỗi ${A.termErrors} · nghĩa lỗi ${A.meaningErrors}.`;renderAll()");document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').innerHTML='<span class="err">Không mở được v13.</span>';console.error(e)}})();</script></body></html>
