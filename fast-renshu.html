function N(s){return String(s??'').normalize('NFC').trim()}function loadState(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return{}}}function save(){state.currentStage=activeStage;try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}function esc(s){return N(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function js(s){return N(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}function hasJP(s){return /[一-龯ぁ-んァ-ン々〆〤]/.test(N(s))}function hasKana(s){return /[ぁ-んァ-ン]/.test(N(s))}function strip(s){return N(s).replace(/<[^>]+>/g,'').replace(/\s+/g,' ')}function uniq(a){return [...new Set(a.filter(Boolean).map(N).filter(Boolean))]}function addRead(t,r){t=N(t);r=N(r);if(!t||!hasJP(t)||!hasKana(r))return;(readMap[t] ||= []);r.match(/[ぁ-んァ-ンー・･]+/g)?.forEach(x=>{if(!readMap[t].includes(x))readMap[t].push(x)})}

function kanaFrom(v,out=[]){if(!v)return out;if(Array.isArray(v)){v.forEach(x=>kanaFrom(x,out));return out}if(typeof v==='object'){Object.values(v).forEach(x=>kanaFrom(x,out));return out}String(v).match(/[ぁ-んァ-ンー・･]+/g)?.forEach(x=>out.push(x));return out}function readingFrom(...v){return uniq(v.flatMap(x=>kanaFrom(x))).join(' · ')}function bestRead(term,own=''){term=N(term);let m=MANUAL[term];if(m)return m;if(readMap[term]?.length)return readMap[term].slice(0,2).join(' · ');return own}function ttsOf(it){let r=bestRead(it.term,it.reading),k=(r.match(/[ぁ-んァ-ンー・･]+/)||[])[0];if(k)return k;if(/^[ぁ-んァ-ンー]+$/.test(it.term))return it.term;return it.term}function displayReading(it){return bestRead(it.term,it.reading)}

function seedExamRead(data){Object.values(data||{}).forEach(set=>['m1','m2','m3','m4','m5'].forEach(m=>(set[m]||[]).forEach(q=>{let ans=q.opts&&q.ans!=null?N(q.opts[q.ans]):'',w=N(q.word||q.term);if(hasJP(w)&&hasKana(ans))addRead(w,ans);if(hasKana(w)&&hasJP(ans))addRead(ans,w);let exp=N(q.exp||'');let re=/([一-龯々〆〤ぁ-んァ-ンー]+)[（(]([ぁ-んァ-ンー・･]+)[）)]/g,mm;while((mm=re.exec(exp)))addRead(mm[1],mm[2]);}))) }
function examItem(q,m,label,id){let correct=q.opts&&q.ans!=null?N(q.opts[q.ans]):'',w=N(q.word||q.term),sent=strip(q.q||''),term='',reading='';if(hasJP(correct)&&hasKana(w)&&!/[一-龯]/.test(w)){term=correct;reading=w}else if(/[一-龯]/.test(w)){term=w;if(hasKana(correct))reading=correct}else if(hasJP(correct)){term=correct}else{let b=(sent.match(/<b>(.*?)<\/b>/)||[])[1];if(hasJP(b))term=strip(b)}if(!hasJP(term))return null;let meaning=cleanMeaning(term,N(q.exp||q.meaning||sent||''));if(!meaning)return null;return{id:'e'+id,sourceIndex:id,type:'exam',kind:'Từ đề thi',term,reading:bestRead(term,reading),meaning,tags:N((label||'')+' · '+m)}}
function scoreTheme(it,t){let text=N(`${it.term} ${displayReading(it)} ${it.meaning} ${it.tags}`).toLowerCase(),s=0;t.keys.split(/\s+/).forEach(k=>{if(k&&text.includes(k.toLowerCase()))s++});return s}function take(pool,t,n,used){pool.sort((a,b)=>scoreTheme(b,t)-scoreTheme(a,t)||a.sourceIndex-b.sourceIndex);let r=[],keep=[];for(const it of pool){if(r.length<n&&!used.has(it.term)){r.push(it);used.add(it.term)}else keep.push(it)}pool.length=0;pool.push(...keep);while(pool.length&&r.length<n)r.push(pool.shift());return r}function interleave(p){let order=['vocab','vocab','kanji','exam','vocab','grammar','vocab','exam','kanji','exam'],out=[],m=true;while(m){m=false;for(const k of order)if(p[k]?.length){out.push(p[k].shift());m=true}}return out}function buildPath(g){let pools={vocab:[...g.vocab],kanji:[...g.kanji],grammar:[...g.grammar],exam:[...g.exam]},n=Math.ceil(Object.values(pools).flat().length/BATCH),st=[];for(let i=0;i<n;i++){let used=new Set(),t=THEMES.find(x=>x.id===PLAN[i%PLAN.length])||THEMES[0],p={vocab:take(pools.vocab,t,QUOTA.vocab,used),kanji:take(pools.kanji,t,QUOTA.kanji,used),grammar:take(pools.grammar,t,QUOTA.grammar,used),exam:take(pools.exam,t,QUOTA.exam,used)},items=interleave(p);while(items.length<BATCH){let k=['vocab','exam','kanji','grammar'].find(x=>pools[x].length);if(!k)break;items.push(pools[k].shift())}st.push({theme:t.name,items})}let flat=[];st.forEach((s,i)=>s.items.forEach(x=>{x.stage=i;x.reading=bestRead(x.term,x.reading);flat.push(x)}));STAGE_INFO=st.map((s,i)=>({theme:s.theme,count:s.items.length,from:i*BATCH+1,to:i*BATCH+s.items.length}));return flat}
async function loadData(){try{let [vh,kh,hh]=await Promise.all(['vocab.html','kanji.html','hoc-nhanh.html'].map(u=>fetch(u,{cache:'reload'}).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));let id=1,g={vocab:[],kanji:[],grammar:[],exam:[]};evalConst(vh,'VOCAB_DB').forEach(x=>{let term=N(x.kanji||x.word||x.term||x.jp),reading=N(x.kana||x.reading||x.yomi),meaning=N(x.vn||x.meaning||x.vi);addRead(term,reading);if(hasJP(term)&&meaning)g.vocab.push({id:'v'+id,sourceIndex:id++,type:'vocab',kind:'Từ vựng',term,reading,meaning,tags:N(`Bài ${x.lesson||''} · Ngày ${x.day||''} · ${x.type||''}`)})});let kdb=evalConst(kh,'KANJI_DB'),edata=evalConst(kh,'EXAM_DATA');seedExamRead(edata);kdb.forEach(x=>{let term=N(x.k||x.kanji||x.word||x.c),reading=term.length>1?bestRead(term,''):readingFrom(x.kana,x.reading,x.yomi,x.on,x.kun,x.on_yomi,x.kun_yomi,x.onyomi,x.kunyomi),meaning=N(x.vn||x.meaning||x.vi),tags=N(x.hv||x.group||x.note||'');addRead(term,reading);if(hasJP(term)&&meaning)g.kanji.push({id:'k'+id,sourceIndex:id++,type:'kanji',kind:term.length>1?'Từ ghép Kanji':'Kanji',term,reading:bestRead(term,reading),meaning,tags})});evalConst(hh,'GRAMMAR').forEach(x=>{let term=N(x.p||x.pattern||x.term),meaning=N(x.v||x.meaning||x.vi);if(term&&meaning)g.grammar.push({id:'g'+id,sourceIndex:id++,type:'grammar',kind:'Ngữ pháp',term,reading:'',meaning,tags:N(x.t||x.note||'')})});let ev=evalConst(vh,'EXAM_VOCAB_DATA');seedExamRead(Object.fromEntries((ev||[]).map((x,i)=>[i,x])));let ex=[];(ev||[]).forEach(set=>['m1','m2','m3','m4','m5'].forEach(m=>(set[m]||[]).forEach(q=>{let it=examItem(q,m,set.label,id++);if(it)ex.push(it)})));g.exam=ex.slice(0,550);ITEMS=buildPath(g);TOTAL=ITEMS.length;document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Đã sửa reading/nghĩa và tránh trùng sát nhau.`;renderAll()}catch(e){console.error(e);document.getElementById('load').textContent='Không tải được dữ liệu. Hãy tải lại trang.'}}
function stageItems(i){return ITEMS.slice(i*BATCH,Math.min((i+1)*BATCH,TOTAL))}function ans(id){state.answers[id]||={lv0:false,lv1:null,lv2:null,lv3:null};return state.answers[id]}function target(lv,it){return lv==='lv2'?it.meaning:it.term}function score(s,lv){let its=stageItems(s),ok=0;its.forEach(it=>{if(ans(it.id)[lv]===target(lv,it))ok++});return{ok,total:its.length,pct:its.length?Math.round(ok/its.length*100):0}}function stageLevel(i){let its=stageItems(i);if(!its.length)return 0;if(score(i,'lv3').pct>=PASS)return 4;if(score(i,'lv2').pct>=PASS)return 3;if(score(i,'lv1').pct>=PASS)return 2;if(its.some(it=>ans(it.id).lv0||ans(it.id).lv1||ans(it.id).lv2||ans(it.id).lv3))return 1;return 0}function currentStage(){let n=Math.ceil(TOTAL/BATCH);for(let i=0;i<n;i++)if(stageLevel(i)<4)return i;return Math.max(0,n-1)}const icons=['🌰','🌱','🌿','🌷','🌸'],names=['Hạt','Mầm','Cây','Nụ','Hoa'];function renderAll(){renderHero();renderMap();renderLearn();renderStats();renderMistakes();save()}function renderHero(){let n=Math.ceil(TOTAL/BATCH)||1,done=Array.from({length:n},(_,i)=>stageLevel(i)>=4?stageItems(i).length:0).reduce((a,b)=>a+b,0),cur=currentStage();total.textContent=TOTAL||'...';document.getElementById('cur').textContent=String(cur+1).padStart(2,'0');document.getElementById('done').textContent=done;prog.style.width=(TOTAL?done/TOTAL*100:0)+'%'}function renderMap(){let g=document.getElementById('mapGrid');g.innerHTML='';let n=Math.ceil(TOTAL/BATCH),cur=currentStage();for(let i=0;i<n;i++){let lv=stageLevel(i),from=i*BATCH+1,to=Math.min((i+1)*BATCH,TOTAL),inf=STAGE_INFO[i]||{},el=document.createElement('div');el.className='stage '+(lv>=4?'done ':'')+(i===cur?'current ':'');el.innerHTML=`${i===cur?'<div class="badge">Đang học</div>':''}<div class="name">Chặng ${String(i+1).padStart(2,'0')}</div><div class="range">${String(from).padStart(3,'0')}–${String(to).padStart(3,'0')}</div><div class="theme">${esc(inf.theme||'Tổng hợp')}</div><div class="plant">${icons[lv]}</div><div cl function renderLearn(){if(!TOTAL)return;let its=stageItems(activeStage),from=activeStage*BATCH+1,to=Math.min((activeStage+1)*BATCH,TOTAL),inf=STAGE_INFO[activeStage]||{};learnTitle.textContent=`Chặng ${String(activeStage+1).padStart(2,'0')} · ${inf.theme||'Tổng hợp'}`;['lv0','lv1','lv2','lv3'].forEach(x=>document.getElementById('btn'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',mode===x));btnResult.disabled=mode==='lv0';btnLv2.disabled=score(activeStage,'lv1').pct<PASS;btnLv3.disabled=score(activeStage,'lv2').pct<PASS;modeText.textContent=`Mục ${from}–${to} · ${mode.toUpperCase()}`+(resultMode?' · Kết quả':'');scoreText.textContent=mode==='lv0'?'LV0 không cần điểm':`${score(activeStage,mode).pct}%`;let cols=[],html='';if(mode==='lv0'){cols=[{t:'C1 · Từ / Kanji / Ngữ pháp',w:'1.05fr'},{t:'C2 · Nghĩa',w:'1.05fr'},{t:'C3 · LV1',w:'.55fr'}];learnNotice.textContent='LV0: đọc cột 1 + cột 2. Bấm chữ Nhật để nghe. Xong thì bấm Đọc xong → LV1.';html=its.map(it=>`<div class="row" style="--cols:${cols.map(c=>c.w).join(' ')}">${jpCell(it)}<div class="cell"><div class="vn">${esc(it.meaning)}</div><div class="meta">${esc(it.kind)} · ${esc(it.tags)}</div></div><div class="cell ans">trống</div></div>`).join('');actions.className='foot single';actions.innerHTML='<button class="primary" onclick="finishLv0()">Đọc xong → LV1</button>'}if(mode==='lv1'){cols=[{t:resultMode?'C1 · Đáp án gốc':'C1 · Ẩn',w:resultMode?'1fr':'.42fr'},{t:'C2 · Nghĩa',w:'1.18fr'},{t:'C3 · Bạn chọn',w:'.95fr'}];learnNotice.textContent=resultMode?'Kết quả LV1: hiện C1 để so sánh, C3 giữ đáp án bạn chọn.':'LV1: ẩn C1. Bấm nghĩa ở C2 để chọn từ đúng.';html=its.map(it=>{let a=ans(it.id).lv1,cls=resultMode&&a?(a===it.term?' ok':' ng'):'';return `<div class="row" style="--cols:${cols.map(c=>c.w).join(' ')}">${resultMode?jpCell(it):'<div class="cell hidden">Ẩn C1</div>'}<div class="cell click" onclick="pick('${js(it.id)}','lv1')"><div class="vn">${esc(it.meaning)}</div><div class="meta">chạm để chọn từ</div> <div class="jp">${esc(a||'')}</div></div></div>`}).join('');actions.className='foot';actions.innerHTML='<button class="ghost" onclick="showResult()">Xem kết quả</button><button class="primary" onclick="completeStage()">Hoàn thành chặng</button>'}setHead(cols);rows.innerHTML=html;renderHero();renderStats();save()}
function finishLv0(){stageItems(activeStage).forEach(it=>ans(it.id).lv0=true);mode='lv1';resultMode=false;renderLearn();renderMap()}function goMode(m){if(m==='lv0'){mode=m;resultMode=false;renderLearn();return}if(m==='lv1'){if(!stageItems(activeStage).some(it=>ans(it.id).lv0))finishLv0();else{mode='lv1';resultMode=false;renderLearn()}return}if(m==='lv2'){let s=score(activeStage,'lv1');if(s.pct<PASS){alert(`LV1 chưa đạt ${PASS}% (${s.pct}%).`);return}stageItems(activeStage).forEach(it=>ans(it.id).lv1=it.term);mode='lv2';resultMode=false;renderLearn();renderMap();return}if(m==='lv3'){let s=score(activeStage,'lv2');if(s.pct<PASS){alert(`LV2 chưa đạt ${PASS}% (${s.pct}%).`);return}stageItems(activeStage).forEach(it=>ans(it.id).lv2=it.meaning);mode='lv3';resultMode=false;renderLearn();renderMap();return}}function showResult(){if(mode==='lv0')return;resultMode=true;let s=score(activeStage,mode);renderLearn();renderMap();setTimeout(()=>alert(`${mode.toUpperCase()}: ${s.ok}/${s.total} = ${s.pct}%\n${s.pct>=PASS?'Đạt pass.':'Chưa đạt, làm lại level này.'}`),50)}function completeStage(){let s=score(activeStage,'lv3');if(s.pct<PASS){alert(`LV3 chưa đạt ${PASS}% (${s.pct}%).`);return}if(activeStage<Math.ceil(TOTAL/BATCH)-1)activeStage++;mode=nextMode(activeStage);resultMode=false;renderAll();showTab('map')}function choicesFor(it,lv){let f=lv==='lv2'?'meaning':'term',correct=target(lv,it),pool=[...stageItems(activeStage),...ITEMS].filter(x=>x.id!==it.id&&x.kind===it.kind).map(x=>x[f]).filter(Boolean);pool=uniq(pool);return [correct,...pool.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)}function pick(id,lv){let it=ITEMS.find(x=>x.id===id);pickContext={id,lv};CHOICES=choicesFor(it,lv);modalType.textContent=lv.toUpperCase();modalQ.textContent=lv==='lv2'?it.term:it.meaning;modalSub.textContent=lv==='lv2'?'Chọn nghĩa đúng':'Chọn từ / kanji / mẫu ngữ pháp đúng';choices.innerHTML=CHOICES.map((c,i)=>`<button class="choice" onclick="choose(${i})">${esc(c)}</button>`).join('');modal.classList.add('show');if(lv==='lv2')speak(ttsOf(it))}function choose(i){let v=CHOICES[i],{id,lv}=pickContext,it=ITEMS.find(x=>x.id===id);ans(id)[lv]=v;if(v!==target(lv,it))state.mistakes[id]=(state.mistakes[id]||0)+1;closeModal();renderLearn();renderMap()}function closeModal(){modal.classList.remove('show')}function renderMistakes(){let ids=Object.keys(state.mistakes||{});mistakeText.innerHTML=ids.length?`Có <b>${ids.length}</b> mục sai.`:'Chưa có lỗi.';mistakeList.innerHTML=ids.slice(0,120).map(id=>{let it=ITEMS.find(x=>x.id==id);return it?`<div class="card"><h3>${esc(it.term)} <button onclick="speak('${js(ttsOf(it))}')">🔊</button></h3><p>${esc(displayReading(it))} · ${esc(it.meaning)} · ${esc(it.kind)} · sai ${state.mistakes[id]} lần</p></div>`:''}).join('')}function renderStats(){let n=Math.ceil(TOTAL/BATCH)||1,doneStages=Array.from({length:n},(_,i)=>stageLevel(i)>=4).filter(Boolean).length,doneCount=Array.from({length:n},(_,i)=>stageLevel(i)>=4?stageItems(i).length:0).reduce((a,b)=>a+b,0);statsText.innerHTML=`Đã hoàn thành <b>${doneStages}/${n}</b> chặng · <b>${doneCount}/${TOTAL||0}</b> mục. Chặng hiện tại: <b>${String(currentStage()+1).padStart(2,'0')}</b>.`}function resetProgress(){if(confirm('Reset toàn bộ tiến độ Fast Renshu?')){localStorage.removeItem(STORE);state=loadState();state.answers={};state.mistakes={};activeStage=0;mode='lv0';resultMode=false;renderAll();showTab('map')}}loadData();
</script></body></html>
