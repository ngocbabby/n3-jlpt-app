<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8fb3">
<title>Fast Renshu Audit v12</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff8fb;color:#332b38;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:24px;text-align:center}.box{max-width:430px;background:#fff;border:1.5px solid #ffd1e1;border-radius:24px;padding:24px;box-shadow:0 10px 28px rgba(160,86,128,.15)}h1{margin:0 0 8px;font-size:24px}.sub{font-size:13px;color:#7f7188;line-height:1.6}.err{color:#9b263a;font-weight:800}
</style>
</head>
<body>
<div class="box"><h1>🐰🌸 Fast Renshu</h1><div class="sub" id="msg">Đang mở bản audit v12...</div></div>
<script>
(async()=>{
  const core='https://raw.githubusercontent.com/ngocbabby/n3-jlpt-app/6ec26481ac997d3a53c5bc1582e13695dc8f3efc/fast-renshu.html';
  const MANUAL={
    '出張':'しゅっちょう','締切':'しめきり','締め切り':'しめきり','勧めて':'すすめて','勧める':'すすめる','給料':'きゅうりょう','成功':'せいこう','建設':'けんせつ','動作':'どうさ','早退':'そうたい',
    '感じ':'かんじ','家賃':'やちん','最新':'さいしん','向き':'むき','大変だ':'たいへんだ','客がたくさんいる':'きゃくがたくさんいる','落ち着く':'おちつく','半日':'はんにち','扱って':'あつかって','申込書':'もうしこみしょ','流れて':'ながれて','主張':'しゅちょう','少なくなった':'すくなくなった','全部売れた':'ぜんぶうれた','活動':'かつどう','発展':'はってん','縮小':'しゅくしょう','目標':'もくひょう',
    'すぐ怒る':'すぐおこる','不満':'ふまん','産':'さん','両替':'りょうがえ','前後':'ぜんご','次の年':'つぎのとし','外食':'がいしょく','差':'さ','意志':'いし','同じところ':'おなじところ','代金':'だいきん','片方':'かたほう','不安':'ふあん','材料':'ざいりょう','場所':'ばしょ','料':'りょう','合計':'ごうけい','間隔':'かんかく','当日':'とうじつ','期限':'きげん','やり方':'やりかた','料金':'りょうきん','すぐ怒ります':'すぐおこります','傷':'きず','心配だ':'しんぱいだ','後の別の日にやることになった':'あとのべつのひにやることになった','特長':'とくちょう','姿勢':'しせい','農業':'のうぎょう','渡ってはいけません':'わたってはいけません','確実':'かくじつ','床':'ゆか','だいたい1万円':'だいたいいちまんえん','中古':'ちゅうこ','原料':'げんりょう','偶然':'ぐうぜん','満員':'まんいん','心配な':'しんぱいな','中旬':'ちゅうじゅん','者':'しゃ','無駄':'むだ','翌日':'よくじつ','土地':'とち','見本':'みほん','別々':'べつべつ','姉の息子':'あねのむすこ','親戚':'しんせき','平気':'へいき','感覚':'かんかく','実物':'じつぶつ'
  };
  try{
    let html=await fetch(core,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('core');return r.text()});
    html=html.replace(/const MANUAL=\{[^;]*\};/, 'const MANUAL='+JSON.stringify(MANUAL)+';');
    html=html.replace("STORE='fast-renshu-v11'", "STORE='fast-renshu-v12-audit'");
    html=html.replace('Bản sạch · sửa reading/nghĩa','Audit v12 · quét lỗi khi mở');
    html=html.replace('function examItem(q,m,label,id)', "function auditItems(){return {missingReading:ITEMS.filter(x=>/[一-龯々〆〤]/.test(x.term)&&x.kind!=='Ngữ pháp'&&!/[ぁ-んァ-ン]/.test(displayReading(x))).length,termErrors:ITEMS.filter(x=>!/[一-龯ぁ-んァ-ン々〆〤]/.test(x.term)).length,meaningErrors:ITEMS.filter(x=>/^([一-龯ぁ-んァ-ンー]+(?:する)?)[=＝]/.test(x.meaning)).length}}\nfunction examItem(q,m,label,id)");
    html=html.replace("document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Đã sửa reading/nghĩa và tránh trùng sát nhau.`;renderAll()", "const A=auditItems();document.getElementById('load').textContent=`Đã tải ${TOTAL} mục. Audit: thiếu cách đọc ${A.missingReading} · term lỗi ${A.termErrors} · nghĩa lỗi ${A.meaningErrors}.`;renderAll()");
    html=html.replace("statsText.innerHTML=`Đã hoàn thành <b>${doneStages}/${n}</b> chặng · <b>${doneCount}/${TOTAL||0}</b> mục. Chặng hiện tại: <b>${String(currentStage()+1).padStart(2,'0')}</b>.`", "const A=auditItems();statsText.innerHTML=`Đã hoàn thành <b>${doneStages}/${n}</b> chặng · <b>${doneCount}/${TOTAL||0}</b> mục. Chặng hiện tại: <b>${String(currentStage()+1).padStart(2,'0')}</b>.<br>Audit: thiếu cách đọc <b>${A.missingReading}</b> · term lỗi <b>${A.termErrors}</b> · nghĩa lỗi <b>${A.meaningErrors}</b>.`");
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('msg').innerHTML='<span class="err">Không mở được audit v12.</span><br>Hãy tải lại trang.';
    console.error(e);
  }
})();
</script>
</body>
</html>
